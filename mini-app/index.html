<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>My Health — Telegram Mini App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<!-- Telegram Web App SDK: даёт доступ к теме, кнопкам, данным пользователя и т.д. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="frame" id="app">

  <!-- Шапка со score. Маскот и число score — это ОДНИ И ТЕ ЖЕ элементы в обоих
       состояниях: при скролле их top/размер/font-size непрерывно интерполируются
       от развёрнутого к свёрнутому виду (см. app.js), как сжатие в стиле Apple,
       а не подмена одного блока на другой. -->
  <div class="hero-full" id="heroFull">
    <div class="bg-gradient" style="background-image:url('assets/bg-gradient.svg')"></div>

    <!-- Шапка с датой -->
    <div class="calendar-row">
      <p class="date">September 1</p>
      <button class="icon-btn" aria-label="Calendar">
        <img src="assets/icon-calendar.svg" alt="" />
      </button>
    </div>

    <!-- Маскот -->
    <div class="mascot">
      <img src="assets/Mascot-green-big.svg" alt="" class="mascot-img" />
    </div>

    <!-- Health score -->
    <div class="health-score">
      <div class="score-value"><span class="score-num">95</span><span class="score-percent">%</span></div>
      <p class="score-title">Good health score</p>
      <p class="score-sub">Updated just now</p>
    </div>

    <!-- Stress / Energy + Advice -->
    <section class="summary">
      <div class="summary-cards">
        <div class="metric-card">
          <div class="metric-indicator good"></div>
          <div class="metric-top">
            <span class="metric-label">Stress</span>
          </div>
          <div class="metric-value"><span class="num">8</span><span class="unit">bpm</span></div>
          <div class="metric-graph">
            <div class="bar" style="height:7px;background:linear-gradient(180deg,#7f2800,#f6a989)"></div>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-indicator good"></div>
          <div class="metric-top">
            <span class="metric-label">Energy</span>
          </div>
          <div class="metric-value"><span class="num">96</span><span class="unit">bpm</span></div>
          <div class="metric-graph">
            <div class="bar" style="height:54px;background:linear-gradient(0deg,#a5dac3,#007844)"></div>
          </div>
        </div>
      </div>

      <div class="advice">
        <p><span>You're on a roll —</span> <strong>keep doing what you're doing</strong></p>
        <img src="assets/Mascot-green-small.svg" alt="" class="advice-mascot" />
      </div>
    </section>
  </div>

  <!-- CTA -->
  <button class="cta-button">
    <img src="assets/icon-plus.svg" alt="" />
    <span>Log Glucose</span>
  </button>
  <!-- Резервирует место кнопки в потоке — сама кнопка становится
       position:absolute в app.js (см. комментарий там), чтобы её движение
       при скролле можно было придержать и не дать наехать на совет/карточки. -->
  <div class="cta-spacer" id="ctaSpacer"></div>

  <!-- Pinned -->
  <section class="pinned">
    <div class="pinned-title">
      <h2>Pinned</h2>
      <button class="edit-btn">
        <img src="assets/icon-edit.svg" alt="" />
        <span>Edit</span>
      </button>
    </div>

    <!-- Glucose Level -->
    <div class="block">
      <div class="block-heading">
        <img class="drop" src="assets/icon-drop.svg" alt="" />
        <h3>Glucose Level</h3>
        <img class="chevron" src="assets/icon-chevron.svg" alt="" />
      </div>
      <div class="card wide">
        <div class="metric-indicator good"></div>
        <div class="metric-value"><span class="num">92</span><span class="unit">mg/dL</span></div>
        <span class="status-badge good">Good</span>
      </div>
    </div>

    <!-- Heart Data -->
    <div class="block">
      <div class="block-heading">
        <img class="drop" src="assets/icon-heart.svg" alt="" />
        <h3>Heart Data</h3>
        <img class="chevron" src="assets/icon-chevron.svg" alt="" />
      </div>
      <div class="card">
        <div class="metric-indicator good"></div>
        <div class="metric-top"><span class="metric-label">Heart Rate</span><span class="status-badge good">Good</span></div>
        <div class="metric-value"><span class="num">62</span><span class="unit">bpm</span></div>
      </div>
      <div class="card">
        <div class="metric-indicator good"></div>
        <div class="metric-top"><span class="metric-label">HRV</span><span class="status-badge good">Good</span></div>
        <div class="metric-value"><span class="num">90</span><span class="unit">ms</span></div>
      </div>
    </div>

    <!-- Activity -->
    <div class="block">
      <div class="block-heading">
        <img class="drop" src="assets/icon-drop.svg" alt="" />
        <h3>Activity</h3>
        <img class="chevron" src="assets/icon-chevron.svg" alt="" />
      </div>
      <div class="card">
        <div class="metric-top"><span class="metric-label">Calories</span></div>
        <div class="metric-value"><span class="num">420</span><span class="unit">kcal</span></div>
      </div>
      <div class="card">
        <div class="metric-top"><span class="metric-label">Steps</span></div>
        <div class="metric-value"><span class="num">6,800</span><span class="unit">steps</span></div>
      </div>
      <div class="card">
        <div class="metric-top"><span class="metric-label">Distance</span></div>
        <div class="metric-value"><span class="num">3.1</span><span class="unit">mi</span></div>
      </div>
    </div>

    <!-- Sleep -->
    <div class="block">
      <div class="block-heading">
        <img class="drop" src="assets/icon-moon.svg" alt="" />
        <h3>Sleep</h3>
        <img class="chevron" src="assets/icon-chevron.svg" alt="" />
      </div>
      <div class="card wide">
        <div class="metric-value"><span class="num">7</span><span class="unit-inline">h</span><span class="num">42</span><span class="unit-inline">m</span></div>
      </div>
    </div>
  </section>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <img src="assets/icon-nav-health.svg" alt="" />
      <span>My health</span>
    </button>
    <button class="nav-item">
      <img src="assets/icon-nav-profile.svg" alt="" />
      <span>Profile</span>
    </button>
    <button class="nav-item">
      <img src="assets/icon-nav-settings.svg" alt="" />
      <span>Settings</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
